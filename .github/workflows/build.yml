name: Build Flutter App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [apk, appbundle]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: always
          cache-write-only: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Build ${{ matrix.build-type }}
        run: |
          if [ "${{ matrix.build-type }}" = "apk" ]; then
            flutter build apk --release
          else
            flutter build appbundle --release
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.build-type }}
          path: |
            ${{ matrix.build-type == 'apk' && 'build/app/outputs/flutter-apk/app-release.apk' || 'build/app/outputs/bundle/release/app-release.aab' }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Build macOS app
        run: flutter build macos --release

      - name: Create DMG (optional)
        run: |
          brew install create-dmg
          create-dmg \
            --volname "SFY Game Transferrer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "build/macos/SFY-Game-Transferrer.dmg" \
            "build/macos/Build/Products/Release/SFYGameTransferrer.app" || true

      - name: Archive macOS app
        run: |
          cd build/macos/Build/Products/Release
          zip -r SFYGameTransferrer-macos.zip SFYGameTransferrer.app

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/macos/Build/Products/Release/SFYGameTransferrer-macos.zip

      - name: Upload DMG artifact (if created)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: macos-dmg
          path: build/macos/SFY-Game-Transferrer.dmg
        continue-on-error: true

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r SFYGameTransferrer-unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/iphoneos/SFYGameTransferrer-unsigned.ipa

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Build Windows app
        run: flutter build windows --release

      - name: Archive Windows app
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath SFYGameTransferrer-windows.zip

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: build/windows/x64/runner/Release/SFYGameTransferrer-windows.zip

  create-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-macos, build-ios, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get commit message
        id: commit-message
        run: |
          MESSAGE=$(git log --format=%B -n 1 ${{ github.sha }})
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -o 'version: [0-9]\+\.[0-9]\+\.[0-9]\+' pubspec.yaml | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ${{ steps.commit-message.outputs.message }}
            
            ## 📦 Download Assets
            
            ### Android
            - **APK**: Direct installation file
            - **AAB**: Google Play Store submission
            
            ### iOS  
            - **Unsigned IPA**: For sideloading/testing (requires signing for App Store)
            
            ### macOS
            - **ZIP**: Application bundle
            - **DMG**: Installer disk image (if available)
            
            ### Windows
            - **ZIP**: Portable application
            
            ---
            *Built from commit: ${{ github.sha }}*
          files: |
            artifacts/android-apk/app-release.apk
            artifacts/android-appbundle/app-release.aab
            artifacts/ios-unsigned-ipa/SFYGameTransferrer-unsigned.ipa
            artifacts/macos-app/SFYGameTransferrer-macos.zip
            artifacts/macos-dmg/SFY-Game-Transferrer.dmg
            artifacts/windows-app/SFYGameTransferrer-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
